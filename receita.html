<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmácia - Receita</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Geração de Receita</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="estoque.html">Estoque</a>
        <a href="vendas.html">Vendas</a>
        <a href="receita.html">Receita</a>
        <a href="dosagem.html">Dosagem</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>
        <section>
            <h2>Dados da receita</h2>
            <article>
          
                <form>
                    <label for="paciente">Paciente</label>
                    <input type="text" id="paciente" name="paciente">

                    <label for="medico">Médico</label>
                    <input type="text" id="medico" name="medico">

                    <label for="crm">CRM</label>
                    <input type="text" id="crm" name="crm">

                    <label for="medicamento">Medicamento</label>
                    <input type="text" id="medicamento" name="medicamento">

                    <label for="dosagem">Dosagem</label>
                    <input type="text" id="dosagem" name="dosagem">

                    <label for="posologia">Posologia</label>
                    <textarea id="posologia" name="posologia" rows="4"></textarea>

                    <button type="submit">Gerar</button>
                </form>
            </article>
        </section>
    </main>
<footer>
    <h2>Farmácia e Fármacos</h2>
</footer>
</body>
</html>
