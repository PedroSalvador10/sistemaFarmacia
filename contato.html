<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmácia - Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Contato / SAC</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="estoque.html">Estoque</a>
        <a href="vendas.html">Vendas</a>
        <a href="receita.html">Receita</a>
        <a href="dosagem.html">Dosagem</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>
        <section>
            <h2>Fale conosco</h2>
            <article>
                <form>
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome">

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email">

                    <label for="assunto">Assunto</label>
                    <select id="assunto" name="assunto">
                        <option>Dúvida</option>
                        <option>Reclamação</option>
                        <option>Sugestão</option>
                    </select>

                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5"></textarea>

                    <button type="submit">Enviar</button>
                </form>
            </article>
        </section>

        <section>
            <h2>Atendimento</h2>
            <article>
                <h3>Horário</h3>
                <p>Segunda a sábado: 05:48h às 17:34h</p>
                <p>Domingo: 9h às 18h</p>
                <p>Fone: (54) 0000-0000</p>
                <p>Endereço: Rua das Avenidas, 5554</p>
            </article>
        </section>
    </main>
<footer>
    <h2>Farmácia e Fármacos</h2>
</footer>
</body>
</html>
